[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-auth-ldap"
version = "2026.05.04.02"
description = "LDAP / Active Directory authentication plugin for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "ophix-server-base>=2026.05.04.01",
    "django-auth-ldap>=4.0",
]

[project.entry-points."ophix.plugins"]
ophix_auth_ldap = "ophix_auth_ldap"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ophix_auth_ldap" = [
    "locale/**/*",
    "deploy_templates/**/*",
]
